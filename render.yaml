# render.yaml — FastAPI backend for OM Marketing
#
# Serves the product catalogue and receives contact / quote / service
# enquiries, saving each as a lead and emailing both the customer and the owner.
#
# Values marked `sync: false` are secrets — set them in the Render dashboard,
# never in this file. See backend/.env.example for what each one does.

services:
  - type: web
    name: om-marketing-backend
    runtime: python
    region: singapore # closest region to Gujarat
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # pydantic 2.9 has no wheels for 3.14 — pin the runtime
      - key: PYTHON_VERSION
        value: "3.13.4"

      - key: APP_NAME
        value: OM Marketing API
      - key: DEBUG
        value: "False"

      # Comma separated, no trailing slash. Must include the live site or the
      # browser will block every request from it.
      - key: CORS_ORIGINS
        value: https://www.ommarketing.co.in,https://ommarketing.co.in,https://om-marketing.vercel.app,http://localhost:3000

      # Enquiries are stored here. NOTE: Render's free tier has an ephemeral
      # filesystem, so a redeploy wipes SQLite. Notification emails still send.
      # Attach a disk or move to Postgres to retain leads long term.
      - key: DATABASE_URL
        value: sqlite:///./om_marketing.db

      # Signs admin session tokens. Generated once and kept — changing it signs
      # everyone out.
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480" # a working day

      # --- Billing portal admin ---------------------------------------------
      # Used ONCE, on first boot, to create the admin account. Change the
      # password from inside the portal afterwards.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Het Patel

      # --- Printed on invoices ----------------------------------------------
      - key: UDYAM_NUMBER
        value: UDYAM-GJ-01-0593027
      - key: REGISTERED_NAME
        value: OM Marketing
      # The address on the Udyam certificate. An invoice is a legal document,
      # so it carries this rather than the Naroda shop address on the website.
      - key: REGISTERED_ADDRESS
        value: A-104, Het Patel Building, Nikol, Ahmedabad, Gujarat 382350
      # The handwritten signature is NOT in the repo (it is public). Upload it
      # in Render as a Secret File named signature.png, then this path resolves.
      - key: SIGNATURE_PATH
        value: /etc/secrets/signature.png

      # Bank details printed on invoices. sync:false keeps the real values out
      # of this file — set them in the Render dashboard.
      - key: BANK_NAME
        sync: false
      - key: BANK_BRANCH
        sync: false
      - key: BANK_ACCOUNT_NAME
        sync: false
      - key: BANK_ACCOUNT
        sync: false
      - key: BANK_ACCOUNT_TYPE
        sync: false
      - key: BANK_IFSC
        sync: false
      - key: UPI_ID
        sync: false

      # --- Email (Gmail SMTP) ------------------------------------------------
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false # your Gmail address
      - key: SMTP_PASSWORD
        sync: false # Google App Password, NOT the account password
      - key: MAIL_FROM
        sync: false # usually the same as SMTP_USER
      - key: MAIL_FROM_NAME
        value: OM Marketing
      - key: OWNER_EMAIL
        sync: false # where new-enquiry alerts are delivered

      # --- Business details shown in emails ---------------------------------
      - key: BUSINESS_NAME
        value: OM Marketing
      - key: BUSINESS_PHONE
        value: "+919825247312"
      - key: BUSINESS_PHONE_DISPLAY
        value: 98252 47312
      - key: BUSINESS_EMAIL
        value: ommarketing.weighingscale1@gmail.com
      - key: BUSINESS_ADDRESS
        value: Naroda, Ahmedabad, Gujarat, India
      - key: SITE_URL
        value: https://www.ommarketing.co.in
